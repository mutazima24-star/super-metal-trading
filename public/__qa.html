<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layout QA</title><body><label>Language<select id="lang"><option value="/en/">English</option><option value="/">Arabic</option></select></label><label>Width<select id="width"><option>320</option><option selected>375</option><option>390</option><option>480</option><option>720</option><option>768</option><option>960</option><option>1024</option><option>1280</option><option>1440</option><option>1920</option></select></label><button id="check">Check all widths</button><pre id="result"></pre><iframe title="Website preview" src="/en/" style="width:375px;height:850px;border:1px solid"></iframe><script>const f=document.querySelector('iframe'),w=document.querySelector('#width'),l=document.querySelector('#lang');w.onchange=()=>f.style.width=w.value+'px';l.onchange=()=>f.src=l.value;document.querySelector('#check').onclick=async()=>{let r=[];for(const o of w.options){f.style.width=o.value+'px';await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);const d=f.contentDocument.documentElement;r.push({width:+o.value,client:d.clientWidth,scroll:d.scrollWidth,pass:d.scrollWidth<=d.clientWidth})}f.style.width=w.value+'px';document.querySelector('#result').textContent=JSON.stringify(r)}</script></body></html>
